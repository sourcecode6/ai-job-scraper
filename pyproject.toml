[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_job_scraper"
version = "0.1.0"
description = "AI Job Scraper and Matcher"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "beautifulsoup4",
    "sentence-transformers",
    "numpy",
    "loguru"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
