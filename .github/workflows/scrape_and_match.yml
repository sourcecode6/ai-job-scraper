name: Scrape and Match Jobs

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  scrape-and-match:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push updated SQLite db back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Cache pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/nlp_service/requirements.txt

      - name: Cache SentenceTransformer model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-sentence-transformers


      - name: Run Scraper, Matcher, and Emailer
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          MATCH_THRESHOLD: ${{ secrets.MATCH_THRESHOLD || '30' }}
          DATA_RETENTION_DAYS: ${{ secrets.DATA_RETENTION_DAYS || '3' }}
        run: |
          python backend/nlp_service/workflow_runner.py

      - name: Upload Scraper Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-logs
          path: backend/logs/

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Force add jobs.db since it is gitignored by default
          if [ -f backend/data/jobs.db ]; then
            git add -f backend/data/jobs.db
            if ! git diff-index --quiet HEAD; then
              git commit -m "chore: update jobs database [skip ci]"
              # Pull latest changes with rebase, resolving any binary database conflicts in favor of the newly generated database
              git pull --rebase -X theirs
              git push
            else
              echo "No database changes to commit."
            fi
          else
            echo "Database file not found, skipping commit."
          fi
